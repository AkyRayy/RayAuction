# ============================================================
#  RayAuction — основной конфигурационный файл
#  Все тексты игрока находятся в messages.yml (MiniMessage).
#  Раскладка меню и кнопки — в gui.yml.
#  Чёрный список предметов — в blacklist.yml.
# ============================================================

# Версия схемы конфига. Плагин сам мигрирует файл на новую версию
# и оставляет резервную копию config.yml.v<N>.backup рядом.
# Не меняйте это значение вручную.
config-version: 1

# Язык форматирования чисел и дат (BCP-47).
# Влияет только на разделители тысяч и порядок даты, тексты — в messages.yml.
locale: "ru"

# Подробные сообщения в консоль: SQL-тайминги, отклонённые события, синхронизация.
debug: false

# ------------------------------------------------------------
#  База данных
# ------------------------------------------------------------
database:
  # Тип хранилища: h2 | mysql | postgresql
  #   h2         — файл в папке плагина, драйвер встроен в jar. Подходит для одного сервера.
  #   mysql      — для сетей серверов. Драйвер предоставляет Paper.
  #   postgresql — для сетей серверов, драйвер встроен в jar.
  type: "h2"

  host: "localhost"
  port: 3306
  database: "minecraft"
  username: "root"
  password: ""

  # Путь к файлу H2 относительно папки плагина. Используется только при type: h2.
  # Расширение .mv.db добавляет сам драйвер.
  file: "data/auctions"

  # Полный JDBC URL. Если задан (не пустая строка), то host/port/database/file игнорируются.
  # Пример: "jdbc:postgresql://127.0.0.1:5432/minecraft?sslmode=disable"
  jdbc-url: ""

  # SSL/TLS для mysql и postgresql.
  use-ssl: false

  # Размер пула соединений (HikariCP).
  # Правило: 2 ядра БД + число одновременно работающих тяжёлых запросов.
  # Для одного сервера достаточно 10, для сети из 5+ серверов — 15-20 на узел.
  max-pool-size: 10
  min-idle: 2

  # Сколько секунд ждать свободное соединение до ошибки (диапазон 1-120).
  connection-timeout-seconds: 10

  # Время жизни соединения в пуле, в минутах. Должно быть меньше wait_timeout MySQL.
  max-lifetime-minutes: 30

  # Периодический ping соединения, чтобы файрвол/NAT не рвал простаивающие связи, в секундах (минимум 30).
  keepalive-seconds: 120

# ------------------------------------------------------------
#  Мультисерверный режим
# ------------------------------------------------------------
multi-server:
  # Включать только если несколько серверов смотрят в ОДНУ базу.
  # Синхронизация идёт опросом таблицы rayauction_sync_events, Redis не нужен.
  enabled: false

  # Уникальное имя этого сервера в сети. События со своим server-id игнорируются.
  # Дубликаты имён ломают синхронизацию — держите значение уникальным.
  server-id: "survival-1"

  # Как часто опрашивать таблицу событий, в секундах (минимум 1).
  # Меньше значение = быстрее отклик на других серверах, выше нагрузка на БД.
  poll-interval-seconds: 5

  # Сколько событий читать за один опрос (1-1000).
  batch-size: 100

  # Через сколько минут обработанные события удаляются из таблицы.
  event-retention-minutes: 60

  # Сколько ошибок опроса подряд считаются аварией БД.
  # После этого аукцион переходит в режим «только чтение» (покупки и продажи запрещены).
  failure-threshold: 3

  # Пауза режима «только чтение» перед повторной проверкой, в секундах (минимум 5).
  breaker-cooldown-seconds: 300

# ------------------------------------------------------------
#  Валюты
# ------------------------------------------------------------
economy:
  # Порядок списка задаёт порядок кнопок в меню продажи.
  # Первый элемент — валюта по умолчанию.
  currencies:
    - type: "experience"      # Встроенный опыт игрока (уровни переводятся в очки опыта)
      display-name: "Опыт"
      symbol: "XP"
      enabled: true

    - type: "vault"           # Требует Vault + любой economy-плагин
      display-name: "Монеты"
      symbol: "$"
      scale: 2                # Знаков после запятой (0-4)
      enabled: true

    - type: "coinsengine"     # Требует CoinsEngine
      id: "coins"             # Идентификатор валюты из currencies.yml CoinsEngine
      display-name: "Кристаллы"
      symbol: "✦"
      scale: 0
      enabled: false

    - type: "playerpoints"    # Требует PlayerPoints, всегда целые числа
      display-name: "Поинты"
      symbol: "PP"
      enabled: false

  # Валюта, которая подставляется в меню продажи первой.
  # Принимает id валюты или её тип (experience / vault / coinsengine / playerpoints).
  # Пустая строка — первая включённая валюта из списка выше.
  default-currency: ""

  # Имя аккаунта, на который уходит комиссия при tax-destination: account.
  # Если такой игрок никогда не заходил, используется оффлайн-UUID по имени (Java-style).
  tax-account: "ServerAccount"

# ------------------------------------------------------------
#  Аукцион
# ------------------------------------------------------------
auction:
  # Комиссия сервера с каждой продажи.
  # 0.0 = комиссии нет, 0.05 = 5% от цены лота. Максимум 0.95.
  # Комиссия вычитается из дохода продавца: продавец получает price - tax.
  tax-rate: 0.05

  # Куда девается комиссия:
  #   burn    — деньги исчезают из экономики (дефляция);
  #   account — начисляются аккаунту из economy.tax-account.
  tax-destination: "burn"

  # Варианты срока лота в меню продажи. Формат: 30m, 6h, 1d, 7d, "2d 12h".
  # Единицы: s/m/h/d/w. Первый элемент выбирается по умолчанию.
  # Кнопки сроков идут в слоты 29, 30, 31, ... (см. gui.yml).
  default-durations:
    - "6h"
    - "1d"
    - "3d"
    - "7d"

  # Период проверки истёкших лотов, в секундах (минимум 5).
  expiry-check-interval-seconds: 60

  # Сколько лотов обрабатывать за одну проверку истечения.
  expiry-batch-size: 200

  # Куда возвращается предмет истёкшего или отменённого лота:
  #   inventory — сразу в инвентарь, если игрок онлайн и есть место;
  #   mailbox   — всегда во внутреннюю почту (/ah mailbox), забирается вручную.
  # При нехватке места предмет в любом случае падает в почту.
  expired-auction-delivery: "mailbox"

  # Разрешить покупку собственного лота (полезно для тестов, вредно для экономики).
  allow-self-purchase: false

  # Зарезервировано: разрешение выставлять предметы из креативного инвентаря.
  allow-creative-listing: false

  # Пауза между поисками на одного игрока, в секундах. Защита от спама запросами к БД.
  search-cooldown-seconds: 3

  # Окно анти-двойного-клика при покупке, в миллисекундах (минимум 50).
  # Два клика быстрее этого окна считаются одним.
  purchase-cooldown-millis: 300

  # Сколько живёт подтверждение разрушительной команды, в секундах.
  confirmation-ttl-seconds: 30

  # Размер страницы (число лотов) в главном меню и в истории.
  # 36 = строки 2-5 в меню на 54 слота.
  browser-page-size: 36
  history-page-size: 36

  # Сколько записей почты выдавать игроку за один заход (при входе и по кнопке «Забрать всё»).
  mailbox-flush-limit: 32

  # Границы цены лота. min/max — в единицах валюты.
  price-limits:
    min: 1
    max: 1000000000
    # Переопределение для конкретной валюты по её id.
    # id опыта — "experience", Vault — "vault", CoinsEngine — "coinsengine:<id>".
    per-currency:
      experience:
        min: 1
        max: 1000000
      vault:
        min: 1
        max: 1000000000

  limits:
    # Сколько активных лотов может держать игрок без дополнительных прав.
    # Значение -1 = безлимита.
    default: 10

    # Учитывать права вида rayauction.limit.<число> и rayauction.limit.unlimited.
    # Побеждает наибольшее значение; право не может уменьшить лимит из БД.
    permission-based: true

# ------------------------------------------------------------
#  Кеш активных лотов
# ------------------------------------------------------------
cache:
  # Максимум лотов в памяти. При переполнении Caffeine вытесняет самые старые записи.
  maximum-size: 20000

  # Если активных лотов больше этого числа, поиск уходит в SQL вместо перебора в памяти.
  # 0 = всегда искать в памяти.
  sql-fallback-threshold: 20000

  # Период полной сверки кеша с БД, в секундах (минимум 5).
  # В мультисерверном режиме сверку делает синхронизация, задача пропускается.
  refresh-seconds: 60

# ------------------------------------------------------------
#  Поведение при входе игрока
# ------------------------------------------------------------
join:
  # Писать в чат о накопленной почте и опыте.
  notify-mail: true
  notify-expired: true

  # Задержка обработки входа, в тиках (20 тиков = 1 секунда).
  # Даёт клиенту прогрузиться перед сообщениями.
  delay-ticks: 40

  # Сколько записей почты пытаться выдать автоматически при входе.
  mail-preview-limit: 5

# ------------------------------------------------------------
#  Discord-вебхук
# ------------------------------------------------------------
discord:
  enabled: false

  # URL вебхука канала: Настройки канала -> Интеграции -> Вебхуки.
  # Храните в секрете: кто знает URL, тот может писать в канал.
  webhook-url: ""

  notify-on:
    new-auction: true
    purchase: true
    expiry: false

  # Имя и аватар бота, которым вебхук отправит сообщение.
  username: "RayAuction"
  avatar-url: ""

  # Таймаут HTTP-запроса, в секундах.
  timeout-seconds: 5

  # После стольких ошибок подряд отправка ставится на паузу.
  failure-threshold: 3

  # Длительность паузы, в секундах (минимум 5).
  cooldown-seconds: 300

  # Шаблоны сообщений. Поддерживается MiniMessage, теги срезаются до простого текста.
  # Плейсхолдеры: <player>, <buyer>, <seller>, <item>, <price>, <currency>
  # Поля в формате "Название | Значение" добавляются как inline-поля embed.
  embeds:
    new-auction:
      title: "🛒 Новый лот"
      description: "**<player>** выставил **<item>** за **<price> <currency>**"
      color: "#5865F2"
      fields: []
    purchase:
      title: "💰 Лот продан"
      description: "**<buyer>** купил **<item>** у **<seller>** за **<price> <currency>**"
      color: "#57F287"
      fields: []

# ------------------------------------------------------------
#  PlaceholderAPI
# ------------------------------------------------------------
placeholders:
  # Регистрация расширения %rayauction_*%. Требует PlaceholderAPI.
  enabled: true

  # Как часто пересчитывать тяжёлые значения (топы, самый дешёвый лот), в секундах.
  # Плейсхолдеры всегда отдают последний снимок — запросов к БД в тике нет.
  refresh-seconds: 60

# ------------------------------------------------------------
#  Команды
# ------------------------------------------------------------
commands:
  # Алиасы /ah. Основное имя всегда зарегистрировано.
  aliases:
    - "ahouse"
    - "auction"

  # Алиасы /ahadmin.
  admin-aliases:
    - "rayauctionadmin"

# ------------------------------------------------------------
#  Звуки
# ------------------------------------------------------------
# Проигрываются игроку при событиях. Ключи подключены к конкретным моментам:
#   buy    — успешная покупка лота;
#   sell   — успешное выставление лота;
#   cancel — снятие лота (по одному или «снять все»), возврат предмета из меню продажи;
#   claim  — забор предметов/денег из почты;
#   error  — любая неудача (не хватает денег, лот уже куплен и т.п.).
# name — ключ звука Minecraft; пустое имя или удалённый блок = звук выключен.
# volume: 0.0-10.0, pitch: 0.5-2.0 (выше — «тоньше»).
sounds:
  buy:
    name: "entity.player.levelup"
    volume: 0.7
    pitch: 1.4

  sell:
    name: "entity.experience_orb.pickup"
    volume: 0.9
    pitch: 1.2

  cancel:
    name: "block.note_block.pling"
    volume: 0.9
    pitch: 0.7

  claim:
    name: "entity.item.pickup"
    volume: 1.0
    pitch: 1.0

  error:
    name: "entity.villager.no"
    volume: 0.8
    pitch: 1.0

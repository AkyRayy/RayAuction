# ============================================================
#  RayAuction — все тексты, которые видит игрок
#  Формат: MiniMessage (https://docs.advntr.dev/minimessage)
#  Никаких &-кодов и §. Перенос строки в списке = несколько строк lore.
# ============================================================

# Префикс добавляется ко всем сообщениям в чате.
prefix: "<dark_gray>[<gradient:#FFD700:#FF8C00>Аукцион</gradient>]</dark_gray> "

# Ключи, к которым префикс НЕ добавляется (по префиксу ключа).
# Названия меню, кнопок и описания предметов должны быть чистыми.
unprefixed-keys:
  - "gui."

command:
  players-only: "<red>Команда доступна только игрокам."
  player-not-found: "<red>Игрок не найден."
  no-permission: "<red>Недостаточно прав."
  auction:
    description: "Аукцион"
  admin:
    description: "Управление аукционом"

storage:
  failure: "<red>База данных недоступна. Попробуйте позже."
  read-only: "<red>Аукцион временно работает только на чтение: база данных недоступна."

sell:
  hand-empty: "<red>Возьмите предмет в основную руку и повторите."
  no-item: "<red>Предмет не найден."
  invalid-item: "<red>Этот предмет нельзя выставить."
